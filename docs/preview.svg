<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700" role="img" aria-label="薪跳 SalaryDance 界面结构示意图">
  <title>薪跳 SalaryDance 界面结构示意图</title>
  <desc>左侧是常驻右上角的悬浮卡片：今日入账（4 位小数逐帧跳动）、已工作、距离下班、今日预计、当前时薪与本月的口径行，下面是滚动时间选择器的特写。右侧是三步设置面板：薪资模式、工作时间（当月工作日历 + 滚动时间选择器）、使用偏好。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff5fe"/>
      <stop offset="1" stop-color="#dae7fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb43d"/>
      <stop offset="1" stop-color="#f68b1f"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#1b2a4a" flood-opacity="0.15"/>
    </filter>
    <style>
      .t   { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .lbl { font-size: 11px; fill: #4a505a; }
      .cap { font-size: 10.5px; fill: #8a9099; }
      .val { font-size: 12.5px; font-weight: 600; fill: #16181d; }
      .ttl { font-size: 13px; font-weight: 600; fill: #16181d; }
      .num { font-size: 12px; fill: #16181d; font-variant-numeric: tabular-nums; }
      .cal-wd  { font-size: 9px; fill: #8a9099; text-anchor: middle; }
      .cal-day { font-size: 9.5px; fill: #6b7280; text-anchor: middle; font-variant-numeric: tabular-nums; }
      .cal-day.rest    { fill: #b6bcc6; }
      .cal-day.holiday { fill: #ffffff; font-weight: 700; }
      .cal-day.makeup  { fill: #ffffff; font-weight: 700; }
      .wheel { font-size: 11px; fill: #a8aeb6; text-anchor: middle; font-variant-numeric: tabular-nums; }
      .wheel.on { font-size: 12px; font-weight: 700; fill: #16181d; }
    </style>
  </defs>

  <rect width="760" height="700" fill="url(#bg)"/>

  <!-- ==================== floating card ==================== -->
  <g filter="url(#shadow)">
    <rect x="28" y="30" width="300" height="248" rx="16" fill="#ffffff" stroke="#e3ebf7"/>
  </g>
  <circle cx="50" cy="56" r="4.5" fill="url(#accent)"/>
  <circle cx="50" cy="56" r="8" fill="none" stroke="#f68b1f" stroke-opacity="0.25" stroke-width="3"/>
  <text class="t ttl" x="64" y="61">薪跳 SalaryDance</text>
  <text class="t cap" x="312" y="60" text-anchor="end">正在上班</text>
  <line x1="28" y1="76" x2="328" y2="76" stroke="#f1f5fb"/>

  <text class="t cap" x="140" y="98" text-anchor="end">今日入账</text>
  <rect x="148" y="87" width="94" height="17" rx="8.5" fill="#f1f4f9"/>
  <text class="t" x="195" y="99" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4a505a">¥55.5556/时</text>
  <text class="t" x="178" y="138" text-anchor="middle" font-size="30" font-weight="700" fill="#16181d" letter-spacing="-1.2">¥301.4938</text>

  <rect x="46" y="154" width="264" height="50" rx="10" fill="#fafbfe" stroke="#eef3f9"/>
  <line x1="134" y1="156" x2="134" y2="202" stroke="#eef3f9"/>
  <line x1="222" y1="156" x2="222" y2="202" stroke="#eef3f9"/>
  <g class="t" text-anchor="middle">
    <text class="cap" x="90" y="172">已工作</text>
    <text class="val" x="90" y="191">14 h 55 m</text>
    <text class="cap" x="178" y="172">距离下班</text>
    <text class="val" x="178" y="191">3 h 4 m</text>
    <text class="cap" x="266" y="172">今日预计</text>
    <text class="val" x="266" y="191">¥444.44</text>
  </g>

  <rect x="46" y="216" width="264" height="8" rx="4" fill="#edf1f7"/>
  <rect x="46" y="216" width="212" height="8" rx="4" fill="url(#accent)"/>
  <circle cx="258" cy="220" r="8" fill="url(#accent)" stroke="#ffffff" stroke-width="2.5"/>

  <text class="t cap" x="46" y="246">本月预计</text>
  <text class="t val" x="268" y="246" text-anchor="end">¥8000.00</text>
  <rect x="280" y="234" width="34" height="18" rx="6" fill="#f1f4f9"/>
  <g stroke="#4a505a" stroke-width="1.1" fill="none" stroke-linecap="round">
    <path d="M291 237.5 V239.5 M291 246.5 V248.5 M286.5 243 H288.5 M293.5 243 H295.5 M287.8 239.8 L289.2 241.2 M292.8 244.8 L294.2 246.2 M294.2 239.8 L292.8 241.2 M289.2 244.8 L287.8 246.2"/>
    <circle cx="291" cy="243" r="1.8"/>
  </g>
  <path d="M299 241.5 L301 243.5 L299 245.5" stroke="#8a9099" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="62" cy="262" r="4" fill="none" stroke="#a8aeb6" stroke-width="1.1"/>
  <text class="t" x="178" y="266" text-anchor="middle" font-size="10" fill="#8a9099">2026年10月 · 实际工作日 18 天 · 日薪 444.44 元</text>

  <!-- ==================== time picker close-up ==================== -->
  <g filter="url(#shadow)">
    <rect x="28" y="300" width="300" height="200" rx="14" fill="#ffffff" stroke="#e3ebf7"/>
  </g>
  <text class="t ttl" x="46" y="326">时间用滚动选择器</text>
  <text class="t cap" x="46" y="344">滚轮 / 触控板 / 拖动 / 方向键，松手吸附到中间带</text>

  <rect x="46" y="358" width="120" height="30" rx="9" fill="#ffffff" stroke="#dfe7f2"/>
  <text x="60" y="378" class="t num">09:00</text>
  <circle cx="148" cy="373" r="5" fill="none" stroke="#8a9099" stroke-width="1.3"/>
  <path d="M148 370 v3.4 h2.4" fill="none" stroke="#8a9099" stroke-width="1.3" stroke-linecap="round"/>
  <text class="t cap" x="176" y="378">上下班 · 午休共四个时间字段</text>

  <rect x="46" y="398" width="264" height="86" rx="10" fill="#f1f4f9"/>
  <rect x="46" y="434" width="264" height="20" rx="6" fill="#e2e8f2"/>
  <rect x="120" y="390" width="116" height="90" rx="8" fill="#ffffff" stroke="#dfe7f2"/>
  <g class="t">
    <text class="wheel" x="178" y="406">16</text>
    <text class="wheel" x="150" y="424">17</text>
    <text class="wheel on" x="150" y="444">18</text>
    <text class="wheel" x="150" y="464">19</text>
    <text class="wheel" x="206" y="424">57</text>
    <text class="wheel on" x="206" y="444">00</text>
    <text class="wheel" x="206" y="464">01</text>
    <text x="178" y="444" font-size="12" font-weight="700" fill="#8a9099" text-anchor="middle">:</text>
  </g>

  <!-- ==================== settings panel ==================== -->
  <g filter="url(#shadow)">
    <rect x="352" y="30" width="380" height="644" rx="16" fill="#ffffff" stroke="#e3ebf7"/>
  </g>
  <text class="t ttl" x="374" y="58">薪跳 SalaryDance · 首次配置</text>
  <line x1="352" y1="72" x2="732" y2="72" stroke="#f1f5fb"/>

  <!-- step rail -->
  <g class="t">
    <circle cx="382" cy="92" r="9.5" fill="url(#accent)"/>
    <text x="382" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="398" y="96" font-size="12" font-weight="600" fill="#16181d">薪资模式</text>
    <line x1="456" y1="92" x2="482" y2="92" stroke="#dfe7f2"/>
    <circle cx="498" cy="92" r="9.5" fill="url(#accent)"/>
    <text x="498" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="514" y="96" font-size="12" font-weight="600" fill="#16181d">工作时间</text>
    <line x1="572" y1="92" x2="598" y2="92" stroke="#dfe7f2"/>
    <circle cx="614" cy="92" r="9.5" fill="url(#accent)"/>
    <text x="614" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="630" y="96" font-size="12" font-weight="600" fill="#16181d">使用偏好</text>
  </g>

  <!-- ---------- step 1 ---------- -->
  <g class="t">
    <text class="lbl" x="374" y="124">选择薪资模式</text>
    <rect x="374" y="132" width="336" height="34" rx="10" fill="#f1f4f9"/>
    <rect x="378" y="136" width="104" height="26" rx="8" fill="#ffffff" stroke="#e8eef7"/>
    <text x="430" y="153" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16181d">月薪</text>
    <text x="540" y="153" text-anchor="middle" font-size="12.5" fill="#4a505a">日薪</text>
    <text x="650" y="153" text-anchor="middle" font-size="12.5" fill="#4a505a">时薪</text>

    <text class="lbl" x="374" y="188">月薪金额</text>
    <rect x="374" y="196" width="336" height="32" rx="9" fill="#ffffff" stroke="#dfe7f2"/>
    <text x="388" y="217" font-size="13" font-weight="600" fill="#16181d">8000</text>
    <text class="cap" x="696" y="217" text-anchor="end">元</text>

    <text class="lbl" x="374" y="252">本月实际工作日</text>
    <rect x="374" y="260" width="270" height="32" rx="9" fill="#ffffff" stroke="#dfe7f2"/>
    <text x="388" y="281" font-size="13" font-weight="600" fill="#16181d">18</text>
    <text class="cap" x="630" y="281" text-anchor="end">天</text>
    <text class="cap" x="374" y="308">十月：实际工作日 18 天，每日有效工时 8.00 小时，折合时薪 ¥55.5556。</text>
    <text class="cap" x="374" y="324">默认自动填入；改了就进入自定，并出现「恢复自动」。</text>
  </g>

  <!-- ---------- step 2: the month calendar ---------- -->
  <g class="t">
    <line x1="352" y1="342" x2="732" y2="342" stroke="#f1f5fb"/>
    <text class="lbl" x="374" y="364">10 月工作日历 · 共 18 天</text>

    <!-- weekday header, Monday first -->
    <text class="cal-wd" x="388" y="380">一</text>
    <text class="cal-wd" x="430" y="380">二</text>
    <text class="cal-wd" x="472" y="380">三</text>
    <text class="cal-wd" x="514" y="380">四</text>
    <text class="cal-wd" x="556" y="380">五</text>
    <text class="cal-wd" x="598" y="380">六</text>
    <text class="cal-wd" x="640" y="380">日</text>

    <!-- October 2026: the 1st is a Thursday, so three leading blanks -->
    <g>
      <rect x="499" y="392" width="30" height="14" rx="3" fill="#e5484d"/><text class="cal-day holiday" x="514" y="403">1</text>
      <rect x="541" y="392" width="30" height="14" rx="3" fill="#e5484d"/><text class="cal-day holiday" x="556" y="403">2</text>
      <rect x="583" y="392" width="30" height="14" rx="3" fill="#e5484d"/><text class="cal-day holiday" x="598" y="403">3</text>
      <rect x="625" y="392" width="30" height="14" rx="3" fill="#e5484d"/><text class="cal-day holiday" x="640" y="403">4</text>
      <rect x="355" y="410" width="30" height="14" rx="3" fill="#e5484d"/><text class="cal-day holiday" x="370" y="421">5</text>
      <rect x="397" y="410" width="30" height="14" rx="3" fill="#e5484d"/><text class="cal-day holiday" x="412" y="421">6</text>
      <rect x="439" y="410" width="30" height="14" rx="3" fill="#e5484d"/><text class="cal-day holiday" x="454" y="421">7</text>
      <text class="cal-day" x="496" y="421">8</text>
      <text class="cal-day" x="538" y="421">9</text>
      <rect x="583" y="410" width="30" height="14" rx="3" fill="#f68b1f"/><text class="cal-day makeup" x="598" y="421">10</text>
      <text class="cal-day rest" x="640" y="421">11</text>

      <text class="cal-day" x="370" y="439">12</text>
      <text class="cal-day" x="412" y="439">13</text>
      <text class="cal-day" x="454" y="439">14</text>
      <text class="cal-day" x="496" y="439">15</text>
      <text class="cal-day" x="538" y="439">16</text>
      <text class="cal-day rest" x="580" y="439">17</text>
      <text class="cal-day rest" x="622" y="439">18</text>

      <text class="cal-day" x="370" y="457">19</text>
      <text class="cal-day" x="412" y="457">20</text>
      <text class="cal-day" x="454" y="457">21</text>
      <text class="cal-day" x="496" y="457">22</text>
      <text class="cal-day" x="538" y="457">23</text>
      <text class="cal-day rest" x="580" y="457">24</text>
      <text class="cal-day rest" x="622" y="457">25</text>

      <text class="cal-day" x="370" y="475">26</text>
      <text class="cal-day" x="412" y="475">27</text>
      <text class="cal-day" x="454" y="475">28</text>
      <text class="cal-day" x="496" y="475">29</text>
      <text class="cal-day" x="538" y="475">30</text>
      <text class="cal-day rest" x="580" y="475">31</text>
    </g>

    <g class="cap">
      <rect x="374" y="490" width="8" height="8" rx="2" fill="#e5484d"/>
      <text x="387" y="498">法定节假日</text>
      <rect x="458" y="490" width="8" height="8" rx="2" fill="#f68b1f"/>
      <text x="471" y="498">调休上班</text>
      <text x="540" y="498">灰字为工作日，浅灰为休息日</text>
    </g>

    <text class="lbl" x="374" y="522">上班时间</text>
    <text class="lbl" x="530" y="522">下班时间</text>
    <rect x="374" y="530" width="140" height="30" rx="9" fill="#ffffff" stroke="#dfe7f2"/>
    <text x="388" y="549" class="num">09:00</text>
    <circle cx="494" cy="545" r="5" fill="none" stroke="#8a9099" stroke-width="1.3"/>
    <path d="M494 542 v3.4 h2.4" fill="none" stroke="#8a9099" stroke-width="1.3" stroke-linecap="round"/>
    <rect x="530" y="530" width="180" height="30" rx="9" fill="#ffffff" stroke="#dfe7f2"/>
    <text x="544" y="549" class="num">18:00</text>
    <circle cx="690" cy="545" r="5" fill="none" stroke="#8a9099" stroke-width="1.3"/>
    <path d="M690 542 v3.4 h2.4" fill="none" stroke="#8a9099" stroke-width="1.3" stroke-linecap="round"/>
    <text class="cap" x="374" y="578">午休 12:00–13:00（可关）· 跨夜班次：下班早于上班即视为次日</text>
  </g>

  <!-- ---------- step 3 ---------- -->
  <g class="t">
    <line x1="352" y1="598" x2="732" y2="598" stroke="#f1f5fb"/>
    <text class="lbl" x="374" y="620">主题</text>
    <rect x="374" y="628" width="336" height="30" rx="9" fill="#f1f4f9"/>
    <rect x="378" y="632" width="104" height="22" rx="7" fill="#ffffff" stroke="#e8eef7"/>
    <text x="430" y="647" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16181d">浅色</text>
    <text x="540" y="647" text-anchor="middle" font-size="11.5" fill="#4a505a">深色</text>
    <text x="650" y="647" text-anchor="middle" font-size="11.5" fill="#4a505a">跟随系统</text>
  </g>

  <text class="t cap" x="380" y="690" text-anchor="middle">薪跳 SalaryDance · DSH Web 界面插件 · 结构示意图（非运行截图）</text>
</svg>
